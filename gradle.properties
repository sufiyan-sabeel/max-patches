org.gradle.caching = true
org.gradle.jvmargs = -Xms512M -Xmx2048M
org.gradle.parallel = true
android.useAndroidX = true
kotlin.code.style = official
# Extensions are Java only. Prevents adding the Kotlin stdlib.
kotlin.stdlib.default.dependency = false
# MAX Patches versions independently of MAX Patcher and of MAX Engine.
# MAX Patches' own release version. It is what the bundle reports and what the manager shows.
# It is not, and must not become, the upstream project's version: a MAX release is not an upstream
# release, and the two number independently from here.
version = 0.1.0

# The upstream collection this one was forked from, and the commit it was imported at. Recorded so a
# patch's provenance is answerable without either name being confused for the other.
UPSTREAM_BASELINE = 2.3.0-dev.7 (MorpheApp/morphe-patches dev, imported at 581b162d; the navigation fingerprint files are byte-identical at 89ff56e)
